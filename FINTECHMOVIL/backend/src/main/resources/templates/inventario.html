<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMovil - Inventario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        nav { background: #1a1a2e; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 1.4rem; }
        nav a { color: #a0c4ff; text-decoration: none; margin-left: 20px; }
        nav a:hover { color: white; }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
        h2 { color: #1a1a2e; margin-bottom: 20px; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        th { background: #1a1a2e; color: white; padding: 14px 16px; text-align: left; font-size: 0.9rem; }
        td { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .badge-ok { background: #d1fae5; color: #065f46; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-alerta { background: #fee2e2; color: #991b1b; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .empty { text-align: center; padding: 40px; color: #888; }
        .img-prod { width: 48px; height: 48px; object-fit: contain; border-radius: 6px; background: #f3f4f6; }
    </style>
</head>
<body>
    <nav>
        <h1>📱 TechMovil</h1>
        <div>
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/personal}">Personal</a>
            <a th:href="@{/ventas/nueva}">Nueva Venta</a>
        </div>
    </nav>
    <div class="container">
        <h2>📦 Inventario de Celulares</h2>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Stock Mínimo</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="8" class="empty">No hay productos registrados</td>
                </tr>
                <tr th:each="p : ${productos}">
                    <td>
                        <img th:if="${p.imagenUrl != null}" th:src="${p.imagenUrl}" class="img-prod" onerror="this.style.display='none'" alt="img">
                        <span th:unless="${p.imagenUrl != null}">📱</span>
                    </td>
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.marca}"></td>
                    <td th:text="${p.modelo}"></td>
                    <td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                    <td th:text="${p.stock}"></td>
                    <td th:text="${p.stockMinimo}"></td>
                    <td>
                        <span th:if="${p.stock <= p.stockMinimo}" class="badge-alerta">⚠ Alerta</span>
                        <span th:unless="${p.stock <= p.stockMinimo}" class="badge-ok">✓ OK</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
