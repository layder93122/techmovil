<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMovil - Personal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        nav { background: #1a1a2e; color: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 1.4rem; }
        nav a { color: #a0c4ff; text-decoration: none; margin-left: 20px; }
        nav a:hover { color: white; }
        .container { max-width: 1000px; margin: 32px auto; padding: 0 20px; }
        h2 { color: #1a1a2e; margin-bottom: 20px; font-size: 1.5rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        th { background: #1a1a2e; color: white; padding: 14px 16px; text-align: left; font-size: 0.9rem; }
        td { padding: 12px 16px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        .role-admin { background: #ede9fe; color: #5b21b6; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .role-user { background: #e0f2fe; color: #0369a1; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .empty { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <nav>
        <h1>📱 TechMovil</h1>
        <div>
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/inventario}">Inventario</a>
            <a th:href="@{/ventas/nueva}">Nueva Venta</a>
        </div>
    </nav>
    <div class="container">
        <h2>👥 Personal del Sistema</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Username</th>
                    <th>Rol</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="4" class="empty">No hay usuarios registrados</td>
                </tr>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.idUsuario}"></td>
                    <td th:text="${u.nombre}"></td>
                    <td th:text="${u.username}"></td>
                    <td>
                        <span th:if="${u.rol == 'ADMIN'}" class="role-admin" th:text="${u.rol}"></span>
                        <span th:unless="${u.rol == 'ADMIN'}" class="role-user" th:text="${u.rol}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
