server.port=${PORT:8080}
server.error.include-message=always

# Base de datos — Railway inyecta MYSQLHOST/PORT/DATABASE/USER/PASSWORD automaticamente
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:techmovil_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Credenciales de administrador — configurar en Railway con ADMIN_USER y ADMIN_PASS
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASS:admin123}

# JWT — configurar en Railway con JWT_SECRET (minimo 64 caracteres recomendado)
app.jwt.signing=${JWT_SECRET:fintechmovil-sistema-inventario-firma-2026-ok!}

# CORS — en Railway configurar CORS_ORIGINS=https://fintechmovil.vercel.app
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://fintechmovil.vercel.app}

logging.level.com.example.techmovil=INFO
