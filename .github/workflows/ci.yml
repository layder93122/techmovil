name: CI — Build, Test y SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend — Build, Test y Cobertura
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: techmovil_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build y Tests con cobertura JaCoCo
        run: |
          cd FINTECHMOVIL/backend
          ./mvnw clean verify -Dspring.datasource.url=jdbc:h2:mem:testdb -Dspring.datasource.driver-class-name=org.h2.Driver -Dspring.jpa.database-platform=org.hibernate.dialect.H2Dialect

      - name: Subir reporte JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: FINTECHMOVIL/backend/target/site/jacoco/

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd FINTECHMOVIL/backend
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=fintechmovil \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FINTECHMOVIL/frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          cd FINTECHMOVIL/frontend
          npm ci

      - name: Build producción
        run: |
          cd FINTECHMOVIL/frontend
          npm run build

      - name: Subir dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: FINTECHMOVIL/frontend/dist/
